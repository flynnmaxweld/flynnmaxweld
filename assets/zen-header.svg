<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" fill="none">
  <defs>
    <!-- Brushed Platinum Monolith Gradient -->
    <linearGradient id="plat-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#a8b1bd"/>
    </linearGradient>

    <!-- Subtle Sumi Shading -->
    <linearGradient id="sumi-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="25%" stop-color="#484f58" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="1"/>
      <stop offset="75%" stop-color="#484f58" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <style>
      .hero-kanji-balance {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 16px;
        fill: url(#plat-grad);
      }
      .sub-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 10px;
        text-transform: uppercase;
        fill: #8b949e;
      }
      .meta-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
        fill: #545d68;
      }
    </style>
  </defs>

  <!-- Top Micro Hairline -->
  <line x1="80" y1="28" x2="780" y2="28" stroke="url(#sumi-edge)" stroke-width="0.75"/>

  <!-- Top Metadata Markers (Balanced Negative Space) -->
  <text x="80" y="20" class="meta-tag">CRAFT // 001</text>
  <text x="430.0" y="20" class="meta-tag" text-anchor="middle">PRECISION SYSTEMS</text>
  <text x="780" y="20" class="meta-tag" text-anchor="end">TIRUNELVELI &#183; TN</text>

  <!-- Hero Typography: Expansive, Calm, Symmetrical -->
  <text x="438.0" y="82" class="hero-kanji-balance" text-anchor="middle">FLYNN MAXWEL</text>
  <text x="435.0" y="112" class="sub-title" text-anchor="middle">Vibecoder</text>

  <!-- Bottom Micro Hairline -->
  <line x1="160" y1="134" x2="700" y2="134" stroke="url(#sumi-edge)" stroke-width="0.75"/>
</svg>