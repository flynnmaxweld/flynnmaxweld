<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" fill="none">
  <defs>
    <!-- Dark Engineering Graph Paper Pattern -->
    <pattern id="graph-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#162032" stroke-width="0.5"/>
    </pattern>

    <style>
      .hdr-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: #f0f6fc;
      }
      .hdr-title-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
      .hdr-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #94a3b8;
      }
      .meta-lbl {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        fill: #475569;
      }
      .meta-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Notebook Chassis with Engineering Slate Background -->
  <rect x="0.5" y="0.5" width="859" height="179" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Graph Paper Overlay -->
  <rect x="1" y="1" width="858" height="178" rx="7" fill="url(#graph-grid)"/>

  <!-- Left Technical Margin Guide Line (Drafting red/amber margin mark) -->
  <line x1="28" y1="12" x2="28" y2="168" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="28" cy="28" r="2.5" fill="#ef4444"/>
  <circle cx="28" cy="152" r="2.5" fill="#ef4444"/>

  <!-- Top Notebook Metadata Header -->
  <text x="44" y="28" class="meta-lbl">LOGBOOK REF: <tspan class="meta-val">MIDTOWN-LAB-2026</tspan></text>
  <text x="824" y="28" class="meta-lbl" text-anchor="end">SYS: <tspan class="meta-val">ONLINE</tspan></text>

  <!-- Technical Divider Line -->
  <line x1="44" y1="38" x2="824" y2="38" stroke="#1e293b" stroke-width="0.75"/>

  <!-- Hero Name Block -->
  <text x="44" y="86" class="hdr-name">Flynn Maxwel</text>
  
  <!-- Vibecoder Lab Badge -->
  <g transform="translate(305, 62)">
    <rect width="118" height="24" rx="4" fill="#0284c7" fill-opacity="0.18" stroke="#0284c7" stroke-width="0.75"/>
    <text x="59" y="16" class="hdr-title-pill" text-anchor="middle">Vibecoder</text>
  </g>

  <!-- Subtitle -->
  <text x="44" y="116" class="hdr-sub">Full-Stack Engineer &amp; AI Systems Researcher</text>

  <!-- Bottom Technical Drafting Rule -->
  <line x1="44" y1="138" x2="824" y2="138" stroke="#1e293b" stroke-width="0.75"/>
  <text x="44" y="158" class="meta-lbl">DISCIPLINE: AUTONOMOUS AGENTS &amp; FULL-STACK ARCHITECTURE</text>
  <text x="824" y="158" class="meta-lbl" text-anchor="end">EXPERIMENT ARCHIVE // @flynnmaxweld</text>
</svg>