<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" fill="none">
  <defs>
    <!-- Dark Lab Background -->
    <radialGradient id="lab-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151b23"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>

    <!-- Crimson Spider Accent Gradient -->
    <linearGradient id="spider-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#c53030"/>
    </linearGradient>

    <style>
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', sans-serif;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -0.5px;
        fill: #f0f6fc;
      }
      .alias-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        fill: #fca5a5;
      }
      .lab-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #8b949e;
      }
      .status-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #4ade80;
      }
    </style>
  </defs>

  <!-- Lab Chassis with Subtle 1px Border -->
  <rect x="0.5" y="0.5" width="859" height="199" rx="8" fill="url(#lab-bg)" stroke="#262c36" stroke-width="1"/>

  <!-- Subtle Spider Web Geometry Lines (Top Right Corner) -->
  <path d="M 720 0 L 860 140" stroke="#21262d" stroke-width="0.75"/>
  <path d="M 770 0 L 860 90" stroke="#21262d" stroke-width="0.75"/>
  <path d="M 815 0 L 860 45" stroke="#21262d" stroke-width="0.75"/>
  <path d="M 750 30 Q 790 70 830 110" stroke="#1f2937" stroke-width="0.75" fill="none"/>
  <path d="M 785 20 Q 810 50 840 75" stroke="#1f2937" stroke-width="0.75" fill="none"/>

  <!-- Top Metadata Bar -->
  <text x="36" y="32" class="lab-meta">LAB REF // INDIE-01</text>
  <text x="210" y="32" class="status-tag">&#x25CF; PATROLLING &amp; BUILDING // 2026</text>
  <text x="824" y="32" class="lab-meta" text-anchor="end">Tirunelveli, Tamil Nadu</text>

  <!-- Hero Name Block -->
  <text x="36" y="96" class="hero-title">FLYNN MAXWEL</text>

  <!-- Peter Parker "Friendly Neighborhood Vibecoder" Crimson Sticker Pill -->
  <g transform="translate(36, 114)">
    <rect width="365" height="26" rx="4" fill="#7f1d1d" fill-opacity="0.35" stroke="#dc2626" stroke-width="0.75"/>
    <text x="12" y="17" class="alias-pill">&#x25C6; YOUR FRIENDLY NEIGHBORHOOD VIBECODER</text>
  </g>

  <!-- Subtle Webline Divider -->
  <line x1="36" y1="162" x2="824" y2="162" stroke="#21262d" stroke-width="1"/>
  <line x1="420" y1="162" x2="480" y2="162" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Bottom Coordinates & Origin -->
  <text x="36" y="184" class="lab-meta">COORD: 8.7139° N, 77.7567° E</text>
  <text x="824" y="184" class="lab-meta" text-anchor="end">AUTONOMOUS AGENTS &amp; FULL-STACK TECH // @flynnmaxweld</text>
</svg>