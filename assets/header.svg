<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" fill="none">
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -1.5px;
        fill: url(#text-grad);
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: -0.2px;
      }
    </style>
  </defs>

  <!-- Card Background with 1px Swiss Editorial Border -->
  <rect x="0.5" y="0.5" width="859" height="219" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtle Architectural Grid Accent Lines -->
  <line x1="36" y1="48" x2="824" y2="48" stroke="#21262d" stroke-width="1"/>
  <line x1="36" y1="176" x2="824" y2="176" stroke="#21262d" stroke-width="1"/>
  <line x1="600" y1="48" x2="600" y2="176" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Top Metadata Bar -->
  <text x="36" y="32" class="mono-meta" fill="#8b949e">INDEX // 001</text>
  <text x="140" y="32" class="mono-meta" fill="#3fb950">&#x25CF; BUILDING IN 2026</text>
  <text x="824" y="32" class="mono-meta" fill="#8b949e" text-anchor="end">28.6139° N, 77.2090° E &#183; New Delhi, India</text>

  <!-- Big Hero Wordmark -->
  <text x="36" y="112" class="title">FLYNN MAXWEL</text>
  
  <!-- Subtitle -->
