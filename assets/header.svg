<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" fill="none">
  <defs>
    <!-- Deep Cinematic Vignette / Radial Glow -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#12161f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090c10" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Nolan Titanium Metallic Title Gradient -->
    <linearGradient id="metallic-title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e6edf3"/>
      <stop offset="75%" stop-color="#9ea7b3"/>
      <stop offset="100%" stop-color="#545d68"/>
    </linearGradient>

    <!-- Warm Amber / Tungsten Accent Gradient -->
    <linearGradient id="amber-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0883e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0"/>
    </linearGradient>

    <style>
      .cinematic-brand {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 14px;
        fill: url(#metallic-title);
      }
      .cinematic-sub {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 9px;
        fill: #f0883e;
      }
      .telemetry-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #6e7681;
      }
      .telemetry-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #c9d1d9;
      }
    </style>
  </defs>

  <!-- Deep Slate Outer Chassis with 1px border -->
  <rect x="0.5" y="0.5" width="859" height="219" rx="4" fill="url(#vignette)" stroke="#21262d" stroke-width="1"/>

  <!-- Ultra-thin Anamorphic Horizontal Light Blade -->
  <line x1="40" y1="42" x2="820" y2="42" stroke="#161b22" stroke-width="1"/>
  <rect x="180" y="41.5" width="500" height="1" fill="url(#amber-beam)"/>
  <line x1="40" y1="180" x2="820" y2="180" stroke="#161b22" stroke-width="1"/>

  <!-- Left/Right Film Aperture Crop Marks -->
  <line x1="28" y1="36" x2="28" y2="48" stroke="#30363d" stroke-width="1"/>
  <line x1="28" y1="36" x2="40" y2="36" stroke="#30363d" stroke-width="1"/>
  <line x1="832" y1="36" x2="832" y2="48" stroke="#30363d" stroke-width="1"/>
  <line x1="832" y1="36" x2="820" y2="36" stroke="#30363d" stroke-width="1"/>

  <line x1="28" y1="184" x2="28" y2="172" stroke="#30363d" stroke-width="1"/>
  <line x1="28" y1="184" x2="40" y2="184" stroke="#30363d" stroke-width="1"/>
  <line x1="832" y1="184" x2="832" y2="172" stroke="#30363d" stroke-width="1"/>
  <line x1="832" y1="184" x2="820" y2="184" stroke="#30363d" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <text x="44" y="28" class="telemetry-label">SEQUENCE // 001</text>
  <text x="430.0" y="28" class="telemetry-val" text-anchor="middle">&#x25CF; INITIALIZED // 2026</text>
  <text x="816" y="28" class="telemetry-label" text-anchor="end">28.6139° N, 77.2090° E &#183; New Delhi, India</text>

  <!-- Center Nolan Title Block -->
  <!-- Wide-tracked Hero Name -->
  <text x="430.0" y="106" class="cinematic-brand" text-anchor="middle">FLYNN MAXWEL</text>
  
  <!-- Single Focus Title: VIBECODER in Amber -->
  <text x="430.0" y="142" class="cinematic-sub" text-anchor="middle">VIBECODER</text>

  <!-- Subtle Thin Reticle Center Tick -->
  <circle cx="430.0" cy="162" r="2" fill="#30363d"/>

  <!-- Bottom Navigation / Frequency Footer -->
  <text x="44" y="202" class="telemetry-label">TRANSMISSION: ACTIVE</text>
  <text x="430.0" y="202" class="telemetry-label" text-anchor="middle">70MM // PERSPECTIVE</text>
  <text x="816" y="202" class="telemetry-label" text-anchor="end">AUTONOMOUS SYSTEMS // @flynnmaxweld</text>
</svg>